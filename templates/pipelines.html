{% extends 'base.html' %}{% block content %}<section id="pipelines"><h2>Pipelines GoCD</h2><form method="post" action="/pipelines">{{ csrf() }}<label>Titre<input name="title" required></label><label style="display:block">Code YAML<textarea name="yaml" required placeholder="pipelines:"></textarea></label><button>Enregistrer et indexer</button></form>{% for p in pipelines %}<details><summary>{{ p.title }} — {{ 'Indexé' if p.indexed else 'Indexation en attente' }}</summary><pre>{{ p.yaml }}</pre><form method="post" action="/pipelines/{{ p.id }}/index">{{ csrf() }}<button>Réindexer</button></form></details>{% endfor %}</section>
{% endblock %}
