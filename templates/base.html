<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCP Tools</title>
<style>
body{font:16px system-ui;margin:0;background:#f2f5fa;color:#172b43}header{background:#142b46;color:white;padding:24px 5%}main{margin:28px 0;padding:0 20px}section{background:white;padding:24px;margin-bottom:24px;border-radius:12px;box-shadow:0 3px 16px #142b4610}h1,h2{margin-top:0}label{display:inline-flex;flex-direction:column;gap:6px;margin:6px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #b3bfd0;border-radius:6px}textarea{width:95%;min-height:180px}button{background:#1263c4;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;margin:16px 0;display:block;overflow:auto}th,td{padding:12px;border-bottom:1px solid #dce3eb;text-align:left}a{color:#1263c4}.error{background:#ffe2df;padding:14px}.success{background:#dcf6e9;padding:14px}small{color:#52657a}details{margin:12px 0}pre{white-space:pre-wrap}nav a{color:white;margin-right:20px}.danger{background:#a33232}
.environment-grid,.cluster-grid{display:flex;flex-wrap:wrap;gap:16px}.environment-card{flex:1 1 420px;min-width:0;border:1px solid #b3bfd0;padding:18px;border-radius:10px}.cluster-card{flex:1 1 280px;min-width:0;background:#f2f5fa;padding:16px;border-radius:8px}.import-error{color:#a33232}.cluster-card input[type=file]{max-width:100%;box-sizing:border-box}nav a[aria-current=page]{font-weight:bold;text-decoration:underline}.cluster-card label{display:flex;min-width:0;max-width:100%;margin:6px 0}.cluster-card input[type=file]{width:100%}.cluster-card section{padding:12px;box-shadow:none}.cluster-card button{max-width:100%;white-space:normal}.cluster-card table{max-width:100%}</style></head><body><header><h1>OCP Tools</h1><nav><a href="/" {% if request.path == "/" %}aria-current="page"{% endif %}>Environnements et clusters</a><a href="/grafana" {% if request.path == "/grafana" %}aria-current="page"{% endif %}>Import Grafana</a><a href="/pipelines" {% if request.path == "/pipelines" %}aria-current="page"{% endif %}>Pipelines GoCD</a></nav></header><main>
{% for category,message in get_flashed_messages(with_categories=true) %}<p role="status" class="{{ category }}">{{ message }}</p>{% endfor %}
{% macro csrf() %}<input type="hidden" name="csrf" value="{{ session.csrf }}">{% endmacro %}
{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
